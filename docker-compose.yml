services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-app:latest
    container_name: rag-app
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    env_file:
      - .env

    volumes:
      # ── Persistent data (survives container restarts / re-deploys) ──────────
      - rag_documents:/app/documents          # uploaded PDF files
      - rag_chroma:/app/chroma                # ChromaDB vectors (rag/ + vanna/)
      - rag_data:/app/data                    # SQLite database (chat.db)

      # ── One-time migration helpers (safe to remove after first startup) ─────
      # If you have existing JSON config files from a previous version, mount
      # them here so the server can auto-import them into SQLite on first run.
      # Once migrated you'll see the log lines:
      #   "Migrated N DB connection(s) from db_connections.json → SQLite."
      #   "Migrated N URL source(s) from url_sources.json → SQLite."
      # After that you can comment these lines out.
      #- ./db_connections.json:/app/db_connections.json
      #- ./url_sources.json:/app/url_sources.json
      #- ./vanna_trained.json:/app/vanna_trained.json

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rag_documents:
  rag_chroma:
  rag_data:      # SQLite database + any future data files
