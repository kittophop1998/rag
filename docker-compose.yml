services:
  backend:
    build: .
    image: rag-app:latest
    container_name: rag-app
    restart: always

    ports:
      - "127.0.0.1:8004:8004"

    env_file:
      - .env

    volumes:
      - rag_documents:/app/documents
      - rag_chroma:/app/chroma
      - rag_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rag_documents:
  rag_chroma:
  rag_data:
